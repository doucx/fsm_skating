categories:
  three_turn: "转三步 (Three-Turn)"
  bracket: "括弧步 (Bracket)"
  rocker: "摇滚步 (Rocker)"
  counter: "计数步 (Counter)"
  mohawk: "莫霍克步 (Mohawk)"
  choctaw: "乔克陶步 (Choctaw)"

moves:
  # --- 变刃步 (Change of Edge) ---
  - id: "change_of_edge"
    name: "变刃滑行 (Change of Edge)"
    category: "change_of_edge"
    difficulty: 1
    conditions:
      same_foot: true
      same_dir: true
      same_edge: false

  # --- 转三步细分 (Three-Turn) ---
  - id: "forward_outside_three_turn"
    name: "前外转三 (Forward Outside Three-Turn)"
    category: "three_turn"
    difficulty: 2
    turn_rotation: "natural"
    conditions:
      same_foot: true
      same_dir: false
      same_edge: false
    start_constraints:
      dir: "F"
      edge: "O"

  - id: "forward_inside_three_turn"
    name: "前内转三 (Forward Inside Three-Turn)"
    category: "three_turn"
    difficulty: 3
    turn_rotation: "natural"
    conditions:
      same_foot: true
      same_dir: false
      same_edge: false
    start_constraints:
      dir: "F"
      edge: "I"

  - id: "backward_outside_three_turn"
    name: "后外转三 (Backward Outside Three-Turn)"
    category: "three_turn"
    difficulty: 5
    turn_rotation: "natural"
    conditions:
      same_foot: true
      same_dir: false
      same_edge: false
    start_constraints:
      dir: "B"
      edge: "O"

  - id: "backward_inside_three_turn"
    name: "后内转三 (Backward Inside Three-Turn)"
    category: "three_turn"
    difficulty: 4
    turn_rotation: "natural"
    conditions:
      same_foot: true
      same_dir: false
      same_edge: false
    start_constraints:
      dir: "B"
      edge: "I"

  # --- 括弧步 (Bracket) ---
  - id: "bracket"
    name: "括弧步 (Bracket)"
    category: "bracket"
    difficulty: 4
    turn_rotation: "opposite"
    conditions:
      same_foot: true
      same_dir: false
      same_edge: false

  # --- 摇滚步 (Rocker) ---
  - id: "rocker"
    name: "摇滚步 (Rocker)"
    category: "rocker"
    difficulty: 4
    turn_rotation: "natural"
    conditions:
      same_foot: true
      same_dir: false
      same_edge: true

  # --- 计数步 (Counter) ---
  - id: "counter"
    name: "计数步 (Counter)"
    category: "counter"
    difficulty: 4
    turn_rotation: "opposite"
    conditions:
      same_foot: true
      same_dir: false
      same_edge: true

  # --- 标准蹬冰步 (Stroke) ---
  - id: "stroke"
    name: "标准蹬冰步 (Standard Stroke)"
    category: "stroke"
    difficulty: 1
    conditions:
      same_foot: false
      same_dir: true
      same_edge: false

  # --- 交叉步 (Cross Roll) ---
  - id: "cross_roll"
    name: "交叉步 (Cross Roll)"
    category: "cross_roll"
    difficulty: 2
    conditions:
      same_foot: false
      same_dir: true
      same_edge: true

  # --- 莫霍克步细分 (Mohawk) ---
  - id: "forward_inside_mohawk"
    name: "前内莫霍克 (Forward Inside Mohawk)"
    category: "mohawk"
    difficulty: 2
    turn_rotation: "natural"
    conditions:
      same_foot: false
      same_dir: false
      same_edge: true
    start_constraints:
      dir: "F"
      edge: "I"

  - id: "forward_outside_mohawk"
    name: "前外莫霍克 (Forward Outside Mohawk)"
    category: "mohawk"
    difficulty: 3
    turn_rotation: "natural"
    conditions:
      same_foot: false
      same_dir: false
      same_edge: true
    start_constraints:
      dir: "F"
      edge: "O"

  # --- 乔克陶步 (Choctaw) ---
  - id: "choctaw"
    name: "乔克陶步 (Choctaw)"
    category: "choctaw"
    difficulty: 4
    turn_rotation: "opposite"
    conditions:
      same_foot: false
      same_dir: false
      same_edge: false