categories:
  three_turn: "转三步 (Three-Turn)"
  bracket: "括弧步 (Bracket)"
  rocker: "摇滚步 (Rocker)"
  counter: "计数步 (Counter)"
  mohawk: "莫霍克步 (Mohawk)"
  choctaw: "乔克陶步 (Choctaw)"

moves:
  # --- 变刃步 (Change of Edge) ---
  - id: "change_of_edge"
    name: "变刃滑行 (Change of Edge)"
    category: "change_of_edge"
    difficulty: 1
    conditions:
      same_foot: true
      same_dir: true
      same_edge: false
    geometry_config:
      radius_factor: 1.0
      sweep_angle_factor: 1.0

  # --- 转三步细分 (Three-Turn) - 基础步法 ---
  - id: "forward_outside_three_turn"
    name: "前外转三 (Forward Outside Three-Turn)"
    category: "three_turn"
    difficulty: 1
    turn_rotation: "natural"
    conditions:
      same_foot: true
      same_dir: false
      same_edge: false
    start_constraints:
      dir: "F"
      edge: "O"
    geometry_config:
      radius_factor: 0.85     # 转三步较为短促、圆滑
      sweep_angle_factor: 0.95

  - id: "forward_inside_three_turn"
    name: "前内转三 (Forward Inside Three-Turn)"
    category: "three_turn"
    difficulty: 2
    turn_rotation: "natural"
    conditions:
      same_foot: true
      same_dir: false
      same_edge: false
    start_constraints:
      dir: "F"
      edge: "I"
    geometry_config:
      radius_factor: 0.85
      sweep_angle_factor: 0.95

  - id: "backward_outside_three_turn"
    name: "后外转三 (Backward Outside Three-Turn)"
    category: "three_turn"
    difficulty: 3
    turn_rotation: "natural"
    conditions:
      same_foot: true
      same_dir: false
      same_edge: false
    start_constraints:
      dir: "B"
      edge: "O"
    geometry_config:
      radius_factor: 0.85
      sweep_angle_factor: 0.95

  - id: "backward_inside_three_turn"
    name: "后内转三 (Backward Inside Three-Turn)"
    category: "three_turn"
    difficulty: 2
    turn_rotation: "natural"
    conditions:
      same_foot: true
      same_dir: false
      same_edge: false
    start_constraints:
      dir: "B"
      edge: "I"
    geometry_config:
      radius_factor: 0.85
      sweep_angle_factor: 0.95

