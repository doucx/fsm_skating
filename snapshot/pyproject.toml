[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fsm_skating"
version = "0.1.0"
description = "A figure skating step sequence FSM choreographer and verifier"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
]

[project.scripts]
fsm-skating = "fsm_skating.cli:main"